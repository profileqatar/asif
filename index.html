<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhammad — Digital Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --bg-dark: #050814;
    --neon-cyan: #00f3ff;
    --neon-pink: #ff007f;
    --neon-purple: #9d00ff;
    --card-bg: rgba(13, 20, 40, 0.65);
    --card-border: rgba(0, 243, 255, 0.3);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Rajdhani', 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg-dark);
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    position: relative;
    padding: 20px;
  }

  /* Starfield Canvas Background */
  #particles-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* Main Container */
  .main-wrapper {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 850px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* Navigation Header */
  .top-nav {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .nav-btn {
    background: rgba(13, 20, 40, 0.6);
    border: 1px solid var(--card-border);
    color: var(--neon-cyan);
    padding: 8px 18px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
  }

  .nav-btn:hover {
    background: rgba(0, 243, 255, 0.15);
    border-color: var(--neon-cyan);
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    transform: translateY(-2px);
  }

  /* Core Profile Card (Geometric Reference Design) */
  .profile-card {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 36px;
    box-shadow: 0 0 40px rgba(0, 243, 255, 0.15), inset 0 0 20px rgba(0, 243, 255, 0.05);
    backdrop-filter: blur(16px);
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 36px;
    position: relative;
    overflow: hidden;
  }

  /* Geometric Cut Avatar Frame */
  .geo-avatar-container {
    position: relative;
    width: 260px;
    height: 230px;
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .geo-shape-mask {
    width: 100%;
    height: 100%;
    clip-path: polygon(
      30% 0%, 100% 0%, 70% 100%, 0% 100%, 
      18% 38%, 45% 38%, 35% 68%, 8% 68%
    );
    background: #000;
    position: relative;
    box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
  }

  .geo-avatar-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(20%) contrast(110%);
    transition: transform 0.5s ease, filter 0.5s ease;
  }

  .geo-avatar-container:hover .geo-avatar-img {
    filter: grayscale(0%) contrast(100%);
    transform: scale(1.05);
  }

  .geo-glow-border {
    position: absolute;
    inset: -3px;
    clip-path: polygon(
      30% 0%, 100% 0%, 70% 100%, 0% 100%, 
      18% 38%, 45% 38%, 35% 68%, 8% 68%
    );
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink), var(--neon-purple));
    z-index: -1;
    opacity: 0.8;
    filter: blur(4px);
    animation: borderPulse 4s ease-in-out infinite alternate;
  }

  @keyframes borderPulse {
    0% { opacity: 0.5; filter: blur(3px); }
    100% { opacity: 1; filter: blur(7px); }
  }

  /* Vertical Card Divider */
  .card-divider {
    width: 1px;
    height: 180px;
    background: linear-gradient(to bottom, transparent, var(--neon-cyan), transparent);
    opacity: 0.5;
  }

  /* Profile Text Content */
  .profile-details {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .name-header {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .name-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ffffff, var(--neon-cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .verified-badge {
    color: var(--neon-cyan);
    font-size: 20px;
    filter: drop-shadow(0 0 8px var(--neon-cyan));
  }

  .location-tag {
    font-size: 15px;
    color: #a0aec0;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
  }

  .location-tag i {
    color: var(--neon-pink);
    filter: drop-shadow(0 0 5px var(--neon-pink));
  }

  /* Status Pill Indicator */
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0, 243, 255, 0.08);
    border: 1px solid rgba(0, 243, 255, 0.3);
    padding: 4px 14px;
    border-radius: 50px;
    font-size: 13px;
    width: fit-content;
    margin: 4px 0;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background-color: #00ff88;
    border-radius: 50%;
    box-shadow: 0 0 10px #00ff88;
    animation: pulse 1.8s infinite;
  }

  @keyframes pulse {
    0% { opacity: 0.4; }
    50% { opacity: 1; transform: scale(1.2); }
    100% { opacity: 0.4; }
  }

  /* Social Links Grid inside Card */
  .social-actions-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
  }

  .social-icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(0, 243, 255, 0.3);
    color: var(--neon-cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 16px;
    transition: all 0.3s ease;
  }

  .social-icon-btn:hover {
    background: var(--neon-cyan);
    color: #000;
    box-shadow: 0 0 15px var(--neon-cyan);
    transform: translateY(-3px);
  }

  /* Interactive Action Grid */
  .actions-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    width: 100%;
  }

  .action-btn {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 16px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: #fff;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    backdrop-filter: blur(10px);
    cursor: pointer;
  }

  .action-btn i {
    font-size: 22px;
    color: var(--neon-cyan);
    transition: transform 0.3s ease;
  }

  .action-btn span {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .action-btn:hover {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
    transform: translateY(-4px);
  }

  .action-btn:hover i {
    transform: scale(1.15);
    filter: drop-shadow(0 0 8px var(--neon-cyan));
  }

  /* Primary vCard CTA */
  .cta-button {
    width: 100%;
    background: linear-gradient(135deg, rgba(0, 243, 255, 0.15), rgba(157, 0, 255, 0.25));
    border: 1px solid var(--neon-cyan);
    border-radius: 16px;
    padding: 16px;
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
    transition: all 0.3s ease;
    text-transform: uppercase;
  }

  .cta-button:hover {
    background: linear-gradient(135deg, rgba(0, 243, 255, 0.3), rgba(255, 0, 127, 0.4));
    box-shadow: 0 0 35px rgba(0, 243, 255, 0.5);
    transform: scale(1.02);
  }

  .cta-button i {
    font-size: 18px;
    color: var(--neon-cyan);
  }

  /* QR Modal Overlay */
  .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(5, 8, 20, 0.85);
    backdrop-filter: blur(15px);
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .modal.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-content {
    background: rgba(13, 20, 40, 0.95);
    border: 1px solid var(--neon-cyan);
    border-radius: 20px;
    padding: 24px;
    width: 85%;
    max-width: 350px;
    text-align: center;
    box-shadow: 0 0 40px rgba(0, 243, 255, 0.3);
    position: relative;
  }

  .close-modal {
    position: absolute;
    top: 15px;
    right: 15px;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
  }

  .qr-code-box {
    margin: 20px 0;
    background: #fff;
    padding: 15px;
    border-radius: 12px;
    display: inline-block;
  }

  .qr-code-box img {
    width: 160px;
    height: 160px;
  }

  @media (max-width: 768px) {
    .profile-card {
      flex-direction: column;
      gap: 20px;
      padding: 24px;
      text-align: center;
    }

    .card-divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--neon-cyan), transparent);
    }

    .name-header, .location-tag, .social-actions-bar {
      justify-content: center;
    }

    .status-pill {
      margin: 0 auto;
    }
  }

  [dir="rtl"] .actions-grid {
    direction: rtl;
  }
</style>
</head>
<body>

  <!-- Background Particle Canvas -->
  <canvas id="particles-canvas"></canvas>

  <div class="main-wrapper">
    <!-- Top Navigation -->
    <div class="top-nav">
      <button class="nav-btn" id="langToggle">
        <i class="fa-solid fa-globe"></i>
        <span id="langText">عربي</span>
      </button>

      <button class="nav-btn" id="shareBtn">
        <i class="fa-solid fa-qrcode"></i>
      </button>
    </div>

    <!-- Main Reference Style Geometric Profile Card -->
    <div class="profile-card">
      <div class="geo-avatar-container">
        <div class="geo-glow-border"></div>
        <div class="geo-shape-mask">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" alt="Muhammad Avatar" class="geo-avatar-img" id="avatarImg">
        </div>
      </div>

      <div class="card-divider"></div>

      <div class="profile-details">
        <div class="name-header">
          <h1 class="name-title" id="userName">Muhammad</h1>
          <i class="fa-solid fa-circle-check verified-badge"></i>
        </div>

        <div class="location-tag">
          <i class="fa-solid fa-location-dot"></i>
          <span>Doha, Qatar</span>
        </div>

        <div class="status-pill">
          <span class="status-dot"></span>
          <span id="statusText">Active Now (Qatar Time)</span>
        </div>

        <div class="social-actions-bar">
          <a href="#" class="social-icon-btn"><i class="fa-solid fa-globe"></i></a>
          <a href="#" class="social-icon-btn"><i class="fa-brands fa-instagram"></i></a>
          <a href="#" class="social-icon-btn"><i class="fa-brands fa-linkedin-in"></i></a>
          <a href="#" class="social-icon-btn"><i class="fa-brands fa-facebook-f"></i></a>
        </div>
      </div>
    </div>

    <!-- Quick Communication Action Grid -->
    <div class="actions-grid">
      <a href="tel:+97400000000" class="action-btn">
        <i class="fa-solid fa-phone"></i>
        <span id="labelCall">Call</span>
      </a>

      <a href="https://wa.me/97400000000" target="_blank" class="action-btn">
        <i class="fa-brands fa-whatsapp"></i>
        <span id="labelWhatsapp">WhatsApp</span>
      </a>

      <div class="action-btn" id="meetingBtn">
        <i class="fa-solid fa-calendar-check"></i>
        <span id="labelMeeting">Meeting</span>
      </div>

      <div class="action-btn" id="locationBtn">
        <i class="fa-solid fa-compass"></i>
        <span id="labelLocation">Location</span>
      </div>
    </div>

    <!-- vCard Download Primary CTA -->
    <button class="cta-button" id="downloadVcard">
      <i class="fa-solid fa-id-card"></i>
      <span id="labelVcard">Download vCard</span>
    </button>
  </div>

  <!-- QR Code Modal -->
  <div class="modal" id="qrModal">
    <div class="modal-content">
      <i class="fa-solid fa-xmark close-modal" id="closeQrModal"></i>
      <h3 style="font-family: Orbitron; color: var(--neon-cyan);">Scan Profile</h3>
      <div class="qr-code-box">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=https://profileqatar.github.io/asif/" alt="QR Code">
      </div>
      <p style="font-size: 13px; color: #a0aec0;">Scan with camera to open profile instant digital business card.</p>
    </div>
  </div>

  <script>
    // Canvas Cyber Starfield
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');

    let particlesArray = [];
    const numberOfParticles = 65;

    function setCanvasDimensions() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    setCanvasDimensions();
    window.addEventListener('resize', setCanvasDimensions);

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.8;
        this.speedY = (Math.random() - 0.5) * 0.8;
        this.color = Math.random() > 0.5 ? '#00f3ff' : '#ff007f';
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles() {
      particlesArray = [];
      for (let i = 0; i < numberOfParticles; i++) {
        particlesArray.push(new Particle());
      }
    }
    initParticles();

    function connectParticles() {
      for (let a = 0; a < particlesArray.length; a++) {
        for (let b = a; b < particlesArray.length; b++) {
          let dx = particlesArray[a].x - particlesArray[b].x;
          let dy = particlesArray[a].y - particlesArray[b].y;
          let distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 110) {
            ctx.strokeStyle = `rgba(0, 243, 255, ${1 - distance / 110})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
            ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
            ctx.stroke();
          }
        }
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particlesArray.forEach(particle => {
        particle.update();
        particle.draw();
      });
      connectParticles();
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // Multi-Language Switcher (EN/AR)
    let isArabic = false;
    const langToggleBtn = document.getElementById('langToggle');
    const langText = document.getElementById('langText');

    const i18n = {
      en: {
        langText: 'عربي',
        statusText: 'Active Now (Qatar Time)',
        labelCall: 'Call',
        labelWhatsapp: 'WhatsApp',
        labelMeeting: 'Meeting',
        labelLocation: 'Location',
        labelVcard: 'Download vCard'
      },
      ar: {
        langText: 'English',
        statusText: 'نشط الآن (توقيت قطر)',
        labelCall: 'اتصال',
        labelWhatsapp: 'واتساب',
        labelMeeting: 'اجتماع',
        labelLocation: 'الموقع',
        labelVcard: 'تحميل بطاقة الاتصال'
      }
    };

    langToggleBtn.addEventListener('click', () => {
      isArabic = !isArabic;
      const lang = isArabic ? 'ar' : 'en';
      document.body.setAttribute('dir', isArabic ? 'rtl' : 'ltr');

      langText.innerText = i18n[lang].langText;
      document.getElementById('statusText').innerText = i18n[lang].statusText;
      document.getElementById('labelCall').innerText = i18n[lang].labelCall;
      document.getElementById('labelWhatsapp').innerText = i18n[lang].labelWhatsapp;
      document.getElementById('labelMeeting').innerText = i18n[lang].labelMeeting;
      document.getElementById('labelLocation').innerText = i18n[lang].labelLocation;
      document.getElementById('labelVcard').innerText = i18n[lang].labelVcard;
    });

    // Modal Events
    const shareBtn = document.getElementById('shareBtn');
    const qrModal = document.getElementById('qrModal');
    const closeQrModal = document.getElementById('closeQrModal');

    shareBtn.addEventListener('click', () => qrModal.classList.add('active'));
    closeQrModal.addEventListener('click', () => qrModal.classList.remove('active'));

    // Dynamic vCard File Generation
    document.getElementById('downloadVcard').addEventListener('click', () => {
      const vcardData = `BEGIN:VCARD\nVERSION:3.0\nFN:Muhammad\nTITLE:Digital Profile\nTEL;TYPE=CELL:+97400000000\nADR;TYPE=WORK:;;Doha;Qatar\nEND:VCARD`;
      const blob = new Blob([vcardData], { type: 'text/vcard' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', 'Muhammad.vcf');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  </script>
</body>
</html>
